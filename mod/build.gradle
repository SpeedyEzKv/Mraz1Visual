plugins {
    // Loom выбирается сам: fabric-loom-remap для 1.21.11, net.fabricmc.fabric-loom для 26.x (VERSIONS.md)
    id 'dev.kikugie.loom-back-compat'
}

def mc = stonecutter.current.version
def javaVersion = (property('deps.java') as String).toInteger()
def resourceProps = [version: project.mod_version + '+mc' + mc, minecraft: property('deps.minecraft_range'), java: javaVersion,
                     loader: property('deps.fabric_loader')]

version = "${project.mod_version}+mc${mc}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${property('deps.minecraft')}"
    // Официальные маппинги Mojang (для 26.x не нужны — игра без обфускации)
    loomx.applyMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${property('deps.fabric_loader')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property('deps.fabric_api')}"

    // Браузер: компилируемся против API, в игре он необязателен (лаунчер ставит его сам)
    modCompileOnly "maven.modrinth:mcef-modern:${property('deps.mcef')}"
    // Классы Chromium (CefBrowser) лежат внутри MCEF вложенным jar — для компиляции берём их отдельно
    compileOnly "me.friwi:jcef-api:${project.jcef_api_version}"
    if (project.findProperty('dev_mcef') == 'true') {
        modLocalRuntime "maven.modrinth:mcef-modern:${property('deps.mcef')}"
    }

    // Встроенный музыкальный плеер: MP3 — JLayer (LGPL-2.1), FLAC — jflac (Apache-2.0); OGG — stb_vorbis из LWJGL игры
    implementation "javazoom:jlayer:1.0.1"
    include "javazoom:jlayer:1.0.1"
    implementation "org.jflac:jflac-codec:1.5.2"
    include "org.jflac:jflac-codec:1.5.2"

    // Проверка совместимости: dev-клиент запускается сразу с Sodium и Iris
    if (project.findProperty('dev_sodium') == 'true') {
        modLocalRuntime "maven.modrinth:sodium:${property('deps.sodium')}"
        modLocalRuntime "maven.modrinth:iris:${property('deps.iris')}"
    }
}

// dev-клиент: окно побольше — для скриншотов и замеров стенда (dev.mraz1visual.dev.Harness)
loom {
    runs {
        client {
            // общая папка запуска mod/run для всех версий: стенд, скриншоты, конфиг
            runDir = '../../run'
            programArgs '--width', '1600', '--height', '900'
            // профилирование: ./gradlew runClient -Pjfr=путь.jfr
            if (project.findProperty('jfr')) vmArg "-XX:StartFlightRecording=filename=${project.findProperty('jfr')},settings=profile"
        }
    }
}

processResources {
    inputs.properties resourceProps
    filesMatching('fabric.mod.json') { expand resourceProps }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.encoding = 'UTF-8'
}

jar {
    from(rootProject.file('LICENSE')) { rename { "${it}_${project.base.archivesName.get()}" } }
}

// Готовый jar версии → mod/build/libs/all/mraz1visual-<модверсия>+mc<версия>.jar (для CI и лаунчера)
tasks.register('collectJar', Copy) {
    group = 'build'
    from loomx.modJar.flatMap { it.archiveFile }
    into rootProject.layout.buildDirectory.dir('libs/all')
}
tasks.named('build') { finalizedBy 'collectJar' }

apply from: rootProject.file('cosmetics.gradle')
