plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Официальные маппинги Mojang: тот же нейминг, что в 26.x, порт будет дешёвым
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Браузер: компилируемся против API, в игре он необязателен (лаунчер ставит его сам)
    modCompileOnly "maven.modrinth:mcef-modern:${project.mcef_version}"
    // Классы Chromium (CefBrowser) лежат внутри MCEF вложенным jar — для компиляции берём их отдельно
    compileOnly "me.friwi:jcef-api:${project.jcef_api_version}"
    if (project.findProperty('dev_mcef') == 'true') {
        modLocalRuntime "maven.modrinth:mcef-modern:${project.mcef_version}"
    }

    // Встроенный музыкальный плеер: MP3 — JLayer (LGPL-2.1), FLAC — jflac (Apache-2.0); OGG — stb_vorbis из LWJGL игры
    implementation "javazoom:jlayer:1.0.1"
    include "javazoom:jlayer:1.0.1"
    implementation "org.jflac:jflac-codec:1.5.2"
    include "org.jflac:jflac-codec:1.5.2"

    // Проверка совместимости: dev-клиент запускается сразу с Sodium и Iris
    if (project.findProperty('dev_sodium') == 'true') {
        modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
        modLocalRuntime "maven.modrinth:iris:${project.iris_version}"
    }
}

// dev-клиент: окно побольше — для скриншотов и замеров стенда (dev.mraz1visual.dev.Harness)
loom {
    runs {
        client {
            programArgs '--width', '1600', '--height', '900'
            // профилирование: ./gradlew runClient -Pjfr=путь.jfr
            if (project.findProperty('jfr')) vmArg "-XX:StartFlightRecording=filename=${project.findProperty('jfr')},settings=profile"
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
apply from: 'cosmetics.gradle'
