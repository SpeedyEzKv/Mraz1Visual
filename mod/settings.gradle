pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'KikuGie'; url = 'https://maven.kikugie.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Мультиверсия: один исходный код в src/, по проекту на версию Minecraft в versions/<версия>
    id 'dev.kikugie.stonecutter' version '0.9.8'
    // Сам выбирает Loom: с ремапом для 1.21.11, без ремапа (net.fabricmc.fabric-loom) для 26.x
    id 'dev.kikugie.loom-back-compat' version '0.4.3'
    // JDK 25 для 26.x скачивается сам, если не установлен
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'
    create(rootProject) {
        // Таблица и статусы — VERSIONS.md. 26.1.2 покрывает 26.1–26.1.2.
        versions '1.21.11', '26.1.2', '26.2', '26.3'
        vcsVersion = '1.21.11'
    }
}

rootProject.name = 'mraz1visual'
